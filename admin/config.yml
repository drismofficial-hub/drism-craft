backend:
  name: git-gateway
  branch: main

media_folder: "website/images"
public_folder: "website/images"

collections:
  - name: "catalog"
    label: "Catalog & Artworks"
    files:
      - name: "products"
        label: "Products & Artworks"
        file: "website/content/products.json"
        fields:
          - name: "products"
            label: "Products List"
            widget: "list"
            summary: '{{fields.title}} - {{fields.price}}'
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: [{label: "Woodcarving", value: "woodcarving"}, {label: "Laser Engraving", value: "laser"}, {label: "Artworks & Resin", value: "artworks"}]}
              - {label: "Price (e.g. GH₵ 1,500)", name: "price", widget: "string"}
              - {label: "Product Image", name: "image", widget: "image"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Specifications", name: "specs", widget: "string"}
