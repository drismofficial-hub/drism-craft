<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRISM CRAFT Admin Dashboard</title>
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* Styling for the CMS editor and preview pane */
    img {
      max-width: 100% !important;
      max-height: 220px !important;
      object-fit: cover !important;
      border-radius: 12px !important;
      margin-top: 8px !important;
      margin-bottom: 8px !important;
    }
  </style>
</head>
<body>
  <!-- Include Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Inject preview thumbnail styling into Decap CMS preview pane
    const customPreviewCSS = `
      img {
        max-width: 100% !important;
        max-height: 220px !important;
        object-fit: cover !important;
        border-radius: 12px !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        display: block !important;
        margin: 10px 0 !important;
      }
    `;

    // Register custom preview style
    const styleTag = document.createElement('style');
    styleTag.innerHTML = customPreviewCSS;
    document.head.appendChild(styleTag);

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
